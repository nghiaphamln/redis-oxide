name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Enforce repository hygiene
        shell: bash
        run: |
          ! git ls-files | rg '^redis-oxide/clippy_.*\.txt$'
          ! rg --pcre2 '[\x{1F000}-\x{1FAFF}]' redis-oxide --glob '*.rs'
          ! rg 'allow\(clippy' redis-oxide --glob '*.rs'
      - name: Verify publishable package
        run: cargo package --locked -p redis-oxide

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Enforce formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Linting
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::all -D clippy::pedantic -D clippy::nursery -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Run unit and standalone integration tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Run doc tests
        run: cargo test --locked --doc --all-features

  cross-platform:
    name: Cross Platform
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Build
        run: cargo build --locked --release --all-features
      - name: Run unit tests
        run: cargo test --locked --lib --all-features

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check minimum supported Rust version
        run: cargo check --locked --all-targets --all-features

  topology-e2e:
    name: Cluster and Sentinel E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Start Redis Cluster
        run: |
          docker compose -f redis-oxide/tests/fixtures/redis-topologies.compose.yml up -d cluster-1 cluster-2 cluster-3
          docker compose -f redis-oxide/tests/fixtures/redis-topologies.compose.yml run --rm cluster-init
      - name: Test Redis Cluster
        run: cargo test --locked --test test_topology_e2e cluster_bootstraps_slots_and_routes_multiple_keys -- --ignored
        env:
          REDIS_CLUSTER_URL: redis://127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
      - name: Start Redis Sentinel
        run: |
          docker compose -f redis-oxide/tests/fixtures/redis-topologies.compose.yml up -d redis-master redis-replica sentinel-1 sentinel-2 sentinel-3
          for _ in {1..30}; do
            if docker compose -f redis-oxide/tests/fixtures/redis-topologies.compose.yml exec -T sentinel-1 redis-cli -p 26379 sentinel get-master-addr-by-name mymaster; then
              exit 0
            fi
            sleep 1
          done
          echo "Sentinel did not become ready within 30 seconds" >&2
          exit 1
      - name: Test Redis Sentinel
        run: |
          cargo test --locked --test test_topology_e2e sentinel_discovers_a_master_for_client_operations -- --ignored
          cargo test --locked --test test_topology_e2e sentinel_client_refreshes_after_master_failover -- --ignored
        env:
          REDIS_SENTINEL_ENDPOINTS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
      - name: Stop topology fixtures
        if: always()
        run: docker compose -f redis-oxide/tests/fixtures/redis-topologies.compose.yml down -v

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Security and policy audit
        run: cargo deny --locked check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check documentation
        run: cargo doc --locked --workspace --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  docs-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir . './README.md' './CONTRIBUTING.md' './CHANGELOG.md' './docs/**/*.md'
          fail: true

  examples:
    name: Examples
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Check examples compile
        run: |
          cargo check --locked --examples --all-features
          cargo build --locked --examples --all-features
      - name: Run basic examples
        run: |
          timeout 30s cargo run --locked -p redis-oxide --example basic_usage
        env:
          REDIS_URL: redis://localhost:6379
